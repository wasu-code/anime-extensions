org.gradle.jvmargs=-Xmx6144m
org.gradle.parallel=true
org.gradle.caching=true

# Do not add kotlin-stdlib to every module as an `implementation` dependency (it would be bundled into
# every extension APK). The host app provides it; we only compile against it (see libs.versions.toml).
kotlin.stdlib.default.dependency=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

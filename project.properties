# Project-wide settings that differ between projects.
# Everything that is "branding" or "identity" lives here so the rest of the build can be reused as-is.

# Base namespace. Derived from it:
#   extensions   -> <namespace>.extension.<lang>.<name>   (also the Android applicationId, and the package your source code must use)
#   :core        -> <namespace>.core
#   :utils       -> <namespace>.utils
#   :lib:<name>  -> <namespace>.lib.<name>
namespace=io.github.wasu_code

# Android app label of every extension: "<labelPrefix>: <extension name>"
labelPrefix=Extension

# Prefix of published APK file names: "<apkPrefix>-<lang>.<name>-v<version>.apk"
apkPrefix=extension

# Repo metadata written to repo.json (what Mihon shows for your extension repo)
repoName=wasu's extensions
repoShortName=WSU